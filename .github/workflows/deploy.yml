name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build
        env:
          NITRO_PRESET: node-server

      - name: Bundle images into build
        run: |
          ORIGIN="https://id-preview--87a5a531-92e6-4b0d-9230-d4357af8a4b7.lovable.app"
          for f in src/assets/*.asset.json; do
            url=$(jq -r .url "$f")
            mkdir -p ".output/public$(dirname "$url")"
            curl -fsSL --retry 3 "$ORIGIN$url" -o ".output/public$url"
          done

      - name: Upload build to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: .output/
          remote_path: /var/www/pinkbyte/.output/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: root
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Restart site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: systemctl restart pinkbyte
