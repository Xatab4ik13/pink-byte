name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build
        env:
          NITRO_PRESET: node-server

      - name: Upload build to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: .output/
          remote_path: /var/www/pinkbyte/.output/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: root
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Restart site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: systemctl restart pinkbyte
